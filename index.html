<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7/D Sohbet + Battle Arena</title>
<style>
/* ===== TEMEL STILLER ===== */
* {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0c12;
  color: #e4e6f0;
}

/* ===== GİRİŞ EKRANI ===== */
#login {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #1a2f4f, #0a0c12);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 20px;
  z-index: 1000;
  animation: fadeIn 0.5s ease;
}

#login::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><circle cx="50" cy="50" r="40" stroke="%234a9eff" stroke-width="1" fill="none"/><circle cx="50" cy="50" r="20" stroke="%23ffaa2a" stroke-width="1" fill="none"/></svg>') repeat;
  animation: rotate 60s linear infinite;
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

#login input, #login button {
  width: 85%;
  max-width: 300px;
  height: 52px;
  border-radius: 30px;
  border: 2px solid #2a3a4a;
  background: rgba(26, 31, 42, 0.9);
  padding: 0 20px;
  font-size: 16px;
  color: #fff;
  backdrop-filter: blur(10px);
  z-index: 10;
}

#login button {
  background: linear-gradient(135deg, #2a6eff, #4a9eff);
  border: none;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
}

#login button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px #2a6eff;
}

/* ===== SİDEBAR ===== */
#menu-btn {
  position: fixed;
  left: 16px;
  top: 16px;
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, #2a6eff, #4a9eff);
  border: 3px solid #fff;
  border-radius: 15px;
  color: white;
  font-size: 24px;
  cursor: pointer;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px #2a6eff;
  animation: menuPulse 2s infinite;
}

@keyframes menuPulse {
  0%, 100% { box-shadow: 0 0 30px #2a6eff; }
  50% { box-shadow: 0 0 50px #4a9eff; }
}

#sidebar {
  position: fixed;
  left: -100%;
  top: 0;
  bottom: 0;
  width: 85%;
  max-width: 320px;
  background: rgba(10, 12, 18, 0.98);
  backdrop-filter: blur(20px);
  border-right: 3px solid #2a6eff;
  padding: 80px 20px 20px;
  z-index: 99;
  transition: left 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  overflow-y: auto;
}

#sidebar.open {
  left: 0;
}

.sidebar-header {
  text-align: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 2px solid #2a6eff;
}

.sidebar-header h3 {
  color: #4a9eff;
  font-size: 24px;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 0 20px #4a9eff;
}

.sidebar-btn {
  width: 100%;
  margin: 10px 0;
  padding: 18px 25px;
  background: linear-gradient(135deg, rgba(42, 110, 255, 0.1), rgba(74, 158, 255, 0.05));
  border: 2px solid #2a3a4a;
  border-radius: 20px;
  color: #e4e6f0;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 15px;
  position: relative;
  overflow: hidden;
}

.sidebar-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  transition: left 0.5s;
}

.sidebar-btn:hover::before {
  left: 100%;
}

.sidebar-btn:hover {
  border-color: #4a9eff;
  transform: translateX(10px);
  box-shadow: 0 0 30px rgba(74,158,255,0.3);
}

.sidebar-btn.active {
  background: linear-gradient(135deg, #2a6eff, #4a9eff);
  border-color: #fff;
  box-shadow: 0 0 40px #2a6eff;
}

.sidebar-btn i {
  font-size: 24px;
  width: 30px;
}

/* ===== ANA İÇERİK ===== */
#main-content {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.screen {
  width: 100%;
  height: 100%;
  display: none;
  flex-direction: column;
}

.screen.active {
  display: flex;
}

.hidden {
  display: none !important;
}

/* ===== SOHBET EKRANI ===== */
#chat-screen {
  background: #0a0c12;
}

#topbar {
  height: 70px;
  background: rgba(15, 18, 25, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 3px solid #2a6eff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: relative;
}

#points-display {
  background: linear-gradient(135deg, #1e2a3a, #2a3a4a);
  color: #ffaa2a;
  padding: 10px 25px;
  border-radius: 40px;
  border: 2px solid #4a9eff;
  font-weight: 700;
  font-size: 18px;
  box-shadow: 0 0 30px rgba(74,158,255,0.3);
}

#onlineBtn {
  background: rgba(26, 33, 46, 0.9);
  border: 2px solid #4a9eff;
  border-radius: 40px;
  padding: 10px 25px;
  color: white;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.3s;
}

#onlineBtn:hover {
  background: #2a6eff;
  transform: scale(1.05);
}

#onlinePanel {
  position: fixed;
  top: 80px;
  right: 20px;
  width: 300px;
  max-height: 400px;
  background: rgba(15, 18, 25, 0.98);
  backdrop-filter: blur(20px);
  border: 3px solid #4a9eff;
  border-radius: 20px;
  padding: 15px;
  display: none;
  z-index: 50;
  overflow-y: auto;
}

.userItem {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 10px;
  border-bottom: 1px solid #2a3a4a;
}

.userItem:last-child {
  border-bottom: none;
}

.user-pfp {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid #4a9eff;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.msg {
  max-width: 80%;
  padding: 15px 20px;
  border-radius: 25px;
  font-size: 15px;
  line-height: 1.5;
  animation: msgPop 0.3s ease;
}

@keyframes msgPop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.user { background: #1a212e; align-self: flex-start; }
.me { background: #1a3a6a; align-self: flex-end; }
.admin { background: #4a2a2a; align-self: flex-start; }

#inputBar {
  height: 80px;
  background: rgba(15, 18, 25, 0.98);
  backdrop-filter: blur(10px);
  border-top: 3px solid #2a6eff;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 20px;
}

#text {
  flex: 1;
  height: 50px;
  border: 2px solid #2a3a4a;
  border-radius: 30px;
  background: #1a212e;
  padding: 0 25px;
  font-size: 16px;
  color: white;
}

.media-btn {
  width: 50px;
  height: 50px;
  background: #1a212e;
  border: 2px solid #2a3a4a;
  border-radius: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.media-btn:hover {
  border-color: #4a9eff;
  transform: scale(1.1);
}

/* ===== BATTLE ARENA OYUNU ===== */
.game-screen {
  background: linear-gradient(180deg, #1a2a3a, #0a1a2a);
}

.game-header {
  height: 70px;
  background: rgba(15, 18, 25, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 3px solid #ffaa2a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
}

.game-header h2 {
  font-size: 24px;
  background: linear-gradient(135deg, #fff, #ffaa2a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px #ffaa2a;
}

.server-info {
  display: flex;
  align-items: center;
  gap: 15px;
  background: rgba(0,0,0,0.5);
  padding: 10px 20px;
  border-radius: 40px;
  border: 2px solid #4a9eff;
}

.server-status {
  width: 12px;
  height: 12px;
  background: #4aff4a;
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 20px #4aff4a; }
  50% { box-shadow: 0 0 40px #4aff4a; }
}

.player-count {
  font-size: 18px;
  font-weight: 700;
  color: #ffaa2a;
}

.join-btn {
  background: linear-gradient(135deg, #ffaa2a, #ffcc4a);
  border: none;
  border-radius: 40px;
  padding: 12px 30px;
  color: #0a0c12;
  font-weight: 900;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 0 30px #ffaa2a;
}

.join-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px #ffaa2a;
}

.game-container {
  flex: 1;
  display: flex;
  padding: 20px;
  gap: 20px;
  min-height: 0;
}

/* Oyuncu Listesi */
.players-sidebar {
  width: 250px;
  background: rgba(15, 18, 25, 0.95);
  backdrop-filter: blur(10px);
  border: 3px solid #4a9eff;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.players-sidebar h3 {
  color: #ffaa2a;
  font-size: 20px;
  text-align: center;
  padding-bottom: 15px;
  border-bottom: 2px solid #2a3a4a;
}

.player-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.player-card {
  background: rgba(26, 33, 46, 0.8);
  border: 2px solid #2a3a4a;
  border-radius: 15px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.3s;
}

.player-card:hover {
  border-color: #4a9eff;
  transform: translateX(5px);
}

.player-card.you {
  border-color: #ffaa2a;
  background: rgba(255,170,42,0.1);
}

.player-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid #4a9eff;
}

.player-info {
  flex: 1;
}

.player-name {
  font-weight: 700;
  color: #fff;
  font-size: 14px;
}

.player-health-bar {
  width: 100%;
  height: 6px;
  background: #2a3a4a;
  border-radius: 3px;
  margin: 5px 0;
  overflow: hidden;
}

.player-health-fill {
  height: 100%;
  background: linear-gradient(90deg, #4aff4a, #2aff2a);
  border-radius: 3px;
  transition: width 0.3s;
}

.player-kills {
  font-size: 12px;
  color: #ffaa2a;
}

/* Oyun Alanı */
.game-area {
  flex: 1;
  position: relative;
  background: rgba(15, 18, 25, 0.95);
  backdrop-filter: blur(10px);
  border: 3px solid #ffaa2a;
  border-radius: 20px;
  overflow: hidden;
}

#battle-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Oyun HUD */
.game-hud {
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 10;
}

.your-info {
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  border: 3px solid #ffaa2a;
  border-radius: 20px;
  padding: 15px 25px;
  min-width: 250px;
}

.your-name {
  font-size: 20px;
  font-weight: 900;
  color: #ffaa2a;
  margin-bottom: 10px;
  text-shadow: 0 0 20px #ffaa2a;
}

.your-health {
  margin-bottom: 10px;
}

.health-label {
  font-size: 14px;
  color: #8892a6;
  margin-bottom: 5px;
}

.health-bar-big {
  width: 100%;
  height: 20px;
  background: #2a3a4a;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid #4a5a6a;
}

.health-bar-big-fill {
  height: 100%;
  background: linear-gradient(90deg, #4aff4a, #2aff2a);
  border-radius: 8px;
  transition: width 0.3s;
  box-shadow: 0 0 20px #4aff4a;
}

.weapon-info {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 10px;
}

.current-weapon {
  background: #1a2a3a;
  padding: 8px 15px;
  border-radius: 20px;
  border: 2px solid #4a9eff;
  font-weight: 700;
}

.ammo {
  color: #ffaa2a;
  font-weight: 700;
  font-size: 18px;
}

.kill-counter-big {
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  border: 3px solid #ffaa2a;
  border-radius: 50px;
  padding: 15px 40px;
  font-size: 28px;
  font-weight: 900;
  color: white;
  text-shadow: 0 0 30px #ffaa2a;
}

/* Mobil Kontroller */
.mobile-controls {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  pointer-events: none;
  z-index: 20;
}

.control-group {
  display: flex;
  gap: 15px;
  pointer-events: auto;
}

.control-btn {
  width: 70px;
  height: 70px;
  border-radius: 35px;
  background: rgba(42, 110, 255, 0.9);
  border: 4px solid white;
  color: white;
  font-size: 30px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(5px);
  box-shadow: 0 0 30px rgba(42,110,255,0.5);
  transition: 0.1s;
  touch-action: manipulation;
}

.control-btn:active {
  transform: scale(0.85);
}

.jump-btn {
  background: rgba(255, 170, 42, 0.9);
}

.shoot-btn {
  background: rgba(255, 90, 90, 0.9);
  width: 90px;
  height: 90px;
  font-size: 40px;
  animation: shootGlow 1s infinite;
}

@keyframes shootGlow {
  0%, 100% { box-shadow: 0 0 30px #ff5a5a; }
  50% { box-shadow: 0 0 60px #ff5a5a; }
}

.weapon-selector {
  display: flex;
  gap: 10px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  border-radius: 50px;
  border: 3px solid #ffaa2a;
}

.weapon-option {
  width: 60px;
  height: 60px;
  border-radius: 30px;
  border: 2px solid #4a9eff;
  background: #1a2a3a;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
}

.weapon-option.active {
  background: #ffaa2a;
  border-color: white;
  transform: scale(1.1);
  box-shadow: 0 0 30px #ffaa2a;
}

/* Bekleme Ekranı */
.waiting-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10,12,18,0.98);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 30px;
  z-index: 100;
  border-radius: 20px;
}

.waiting-animation {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.spinner {
  width: 80px;
  height: 80px;
  border: 8px solid #2a3a4a;
  border-top-color: #ffaa2a;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.waiting-text {
  font-size: 32px;
  font-weight: 900;
  color: #ffaa2a;
  text-shadow: 0 0 30px #ffaa2a;
  animation: textPulse 1.5s infinite;
}

@keyframes textPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.connected-players {
  font-size: 24px;
  color: white;
  background: rgba(0,0,0,0.5);
  padding: 20px 40px;
  border-radius: 60px;
  border: 3px solid #4a9eff;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .game-container {
    flex-direction: column;
    padding: 10px;
  }
  
  .players-sidebar {
    width: 100%;
    max-height: 200px;
  }
  
  .your-info {
    min-width: 180px;
    padding: 10px;
  }
  
  .your-name {
    font-size: 16px;
  }
  
  .kill-counter-big {
    font-size: 20px;
    padding: 10px 25px;
  }
  
  .control-btn {
    width: 55px;
    height: 55px;
    font-size: 24px;
  }
  
  .shoot-btn {
    width: 70px;
    height: 70px;
    font-size: 30px;
  }
  
  .weapon-option {
    width: 45px;
    height: 45px;
    font-size: 14px;
  }
}

/* ===== ANİMASYONLAR ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.notification {
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(0,0,0,0.9);
  border: 3px solid #ffaa2a;
  border-radius: 50px;
  padding: 15px 30px;
  color: white;
  font-weight: 700;
  z-index: 2000;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- Giriş Ekranı -->
<div id="login">
  <img id="pfp-preview" style="display:none; width:100px; height:100px; border-radius:50%; border:4px solid #2a6eff;">
  <input type="text" id="nameInput" placeholder="Kullanıcı adı">
  <input type="password" id="codeInput" placeholder="Kod">
  <input type="file" id="pfpInput" accept="image/*" onchange="previewPFP()">
  <button onclick="enter()">ARENA'YA GİRİŞ YAP</button>
  <div id="login-error" style="color:#ff5a5a;"></div>
</div>

<!-- Menü Butonu -->
<button id="menu-btn" onclick="toggleMenu()">☰</button>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-header">
    <h3>⚡ ARENA ⚡</h3>
  </div>
  <button class="sidebar-btn active" onclick="switchScreen('chat')">
    <i>💬</i> Sohbet
  </button>
  <button class="sidebar-btn" onclick="switchScreen('battle')">
    <i>⚔️</i> BATTLE ARENA
  </button>
  <button class="sidebar-btn" onclick="switchScreen('altun')">
    <i>🤖</i> Altun.ai
  </button>
  <button class="sidebar-btn" onclick="openShop()">
    <i>🛒</i> Mağaza
  </button>
  <button class="sidebar-btn" onclick="openInventory()">
    <i>🎒</i> Envanter
  </button>
</div>

<!-- Ana İçerik -->
<div id="main-content">
  
  <!-- Sohbet Ekranı -->
  <div id="chat-screen" class="screen active">
    <div id="topbar">
      <div id="points-display">💰 <span id="user-points">0</span></div>
      <div style="font-size:20px; font-weight:900; color:#fff;">7/D ARENA</div>
      <button id="onlineBtn">👥 <span id="online-count">0</span></button>
    </div>
    <div id="onlinePanel"></div>
    <div id="chat"></div>
    <div id="inputBar">
      <input type="text" id="text" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()">
      <label for="imgInput" class="media-btn">📷</label>
      <input type="file" id="imgInput" accept="image/*" style="display:none;">
      <label for="videoInput" class="media-btn">🎥</label>
      <input type="file" id="videoInput" accept="video/*" style="display:none;">
    </div>
  </div>

  <!-- Battle Arena Oyunu -->
  <div id="battle-screen" class="screen game-screen">
    <div class="game-header">
      <h2>⚔️ BATTLE ARENA ⚔️</h2>
      <div class="server-info">
        <span class="server-status"></span>
        <span class="player-count" id="arena-player-count">0</span>
        <span>Oyuncu</span>
      </div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBVMvgD3u-UT5dAk72pXqLub05qNPjqPW8",
  authDomain: "dsohbet.firebaseapp.com",
  databaseURL: "https://dsohbet-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dsohbet"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Global Değişkenler
let username = '', role = 'user', pfp = '';
let userPoints = 0;
let currentScreen = 'chat';

// Arena Değişkenleri
let arena = {
  connected: false,
  playerId: null,
  players: {},
  bullets: [],
  platforms: [
    { x: 0, y: 550, w: 1000, h: 20 }, // Zemin
    { x: 150, y: 450, w: 150, h: 15 }, // Platform 1
    { x: 400, y: 400, w: 200, h: 15 }, // Platform 2
    { x: 700, y: 450, w: 150, h: 15 }, // Platform 3
    { x: 300, y: 300, w: 150, h: 15 }, // Platform 4
    { x: 550, y: 300, w: 150, h: 15 }, // Platform 5
    { x: 200, y: 200, w: 150, h: 15 }, // Platform 6
    { x: 650, y: 200, w: 150, h: 15 }  // Platform 7
  ],
  weapons: [
    { name: 'Tabanca', damage: 15, speed: 20, cooldown: 250, color: '#ffaa2a', ammo: 30 },
    { name: 'Pompalı', damage: 35, speed: 18, cooldown: 600, color: '#ff5a5a', ammo: 20 },
    { name: 'Sniper', damage: 70, speed: 30, cooldown: 1200, color: '#4a9eff', ammo: 10 }
  ],
  keys: { left: false, right: false, jump: false },
  canvas: null,
  ctx: null,
  animationFrame: null
};

// Giriş
window.enter = () => {
  username = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  
  if (!username) { showError('İsim gerekli!'); return; }
  if (code !== 'deop' && code !== 'kmja' && code !== 'Alex') { 
    showError('Geçersiz kod!'); 
    return; 
  }
  
  if (code === 'deop') role = 'admin';
  
  const file = document.getElementById('pfpInput').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = e => { pfp = e.target.result; initApp(); };
    reader.readAsDataURL(file);
  } else {
    pfp = `https://ui-avatars.com/api/?name=${username}&background=2a6eff&color=fff&size=128`;
    initApp();
  }
}

function initApp() {
  document.getElementById('login').style.display = 'none';
  setupPresence();
  listenMessages();
  listenOnline();
  startBattleArena();
}

// Presence
function setupPresence() {
  const onlineRef = db.ref('online/' + username);
  onlineRef.set({ name: username, role, pfp, lastActive: Date.now() });
  onlineRef.onDisconnect().remove();
}

// Online listesi
function listenOnline() {
  db.ref('online').on('value', (snap) => {
    const panel = document.getElementById('onlinePanel');
    panel.innerHTML = '';
    let count = 0;
    
    snap.forEach(child => {
      const u = child.val();
      count++;
      const div = document.createElement('div');
      div.className = 'userItem';
      div.innerHTML = `
        <img src="${u.pfp}" class="user-pfp">
        <span>${u.name}${u.role === 'admin' ? ' 👑' : ''}</span>
      `;
      panel.appendChild(div);
    });
    
    document.getElementById('online-count').textContent = count;
  });
}

// Mesajlar
function listenMessages() {
  db.ref('messages').on('child_added', (snap) => {
    const m = snap.val();
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `msg ${m.name === username ? 'me' : m.role === 'admin' ? 'admin' : 'user'}`;
    div.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
        <img src="${m.pfp}" style="width:25px; height:25px; border-radius:50%;">
        <span style="font-weight:700;">${m.name}</span>
        <span style="font-size:11px; color:#8892a6;">${m.timeStr || ''}</span>
      </div>
      <div>${m.text || ''}</div>
      ${m.img ? `<img src="${m.img}" style="max-width:200px; border-radius:10px; margin-top:10px;">` : ''}
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  });
}

// Mesaj gönder
window.send = () => {
  const text = document.getElementById('text').value.trim();
  if (!text) return;
  
  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  
  db.ref('messages').push({
    name: username, role, pfp, text, time: Date.now(), timeStr
  });
  
  document.getElementById('text').value = '';
}

// ===== BATTLE ARENA =====
function startBattleArena() {
  arena.canvas = document.getElementById('battle-canvas');
  arena.ctx = arena.canvas.getContext('2d');
}

// Arena'ya katıl
window.joinArena = () => {
  if (!username) return;
  
  document.getElementById('arena-waiting').style.display = 'flex';
  document.getElementById('join-arena-btn').disabled = true;
  
  // Yeni oyuncu oluştur
  arena.playerId = username + '_' + Date.now();
  arena.connected = true;
  
  const playerData = {
    id: arena.playerId,
    name: username,
    pfp: pfp,
    x: 200 + Math.random() * 600,
    y: 400,
    vx: 0,
    vy: 0,
    health: 100,
    kills: 0,
    weapon: 0,
    ammo: [30, 20, 10],
    direction: 1,
    onGround: false,
    lastShot: 0
  };
  
  // Firebase'de oyuncuyu ekle
  db.ref(`arena/players/${arena.playerId}`).set(playerData);
  db.ref(`arena/players/${arena.playerId}`).onDisconnect().remove();
  
  // Arena odasını dinle
  db.ref('arena/players').on('value', (snap) => {
    arena.players = snap.val() || {};
    updatePlayerList();
    document.getElementById('arena-player-count').textContent = Object.keys(arena.players).length;
    document.getElementById('waiting-player-count').textContent = 
      `${Object.keys(arena.players).length} Oyuncu Bağlandı`;
    
    // Bekleme ekranını kaldır
    if (Object.keys(arena.players).length >= 1) {
      document.getElementById('arena-waiting').style.display = 'none';
      document.getElementById('join-arena-btn').style.display = 'none';
      
      // Oyun döngüsünü başlat
      if (!arena.animationFrame) {
        requestAnimationFrame(updateArena);
      }
    }
  });
  
  db.ref('arena/bullets').on('value', (snap) => {
    arena.bullets = Object.values(snap.val() || {});
  });
}

// Oyuncu listesini güncelle
function updatePlayerList() {
  const list = document.getElementById('arena-player-list');
  list.innerHTML = '';
  
  Object.values(arena.players).forEach(p => {
    const div = document.createElement('div');
    div.className = `player-card ${p.id === arena.playerId ? 'you' : ''}`;
    div.innerHTML = `
      <img src="${p.pfp}" class="player-avatar">
      <div class="player-info">
        <div class="player-name">${p.name} ${p.id === arena.playerId ? '(Sen)' : ''}</div>
        <div class="player-health-bar">
          <div class="player-health-fill" style="width:${p.health}%"></div>
        </div>
        <div class="player-kills">💀 ${p.kills}</div>
      </div>
    `;
    list.appendChild(div);
  });
}

// Hareket
window.move = (dir, state) => {
  arena.keys[dir] = state;
}

// Ateş et
window.shoot = () => {
  const player = arena.players[arena.playerId];
  if (!player) return;
  
  const now = Date.now();
  const weapon = arena.weapons[player.weapon];
  
  if (now - player.lastShot < weapon.cooldown) return;
  if (player.ammo[player.weapon] <= 0) return;
  
  player.ammo[player.weapon]--;
  player.lastShot = now;
  
  const bulletId = 'bullet_' + Date.now() + '_' + Math.random();
  const bulletData = {
    id: bulletId,
    x: player.x + (player.direction * 30),
    y: player.y - 20,
    vx: player.direction * weapon.speed,
    vy: 0,
    damage: weapon.damage,
    shooter: arena.playerId,
    weapon: player.weapon
  };
  
  db.ref(`arena/bullets/${bulletId}`).set(bulletData);
  setTimeout(() => {
    db.ref(`arena/bullets/${bulletId}`).remove();
  }, 2000);
  
  // Mermi sayısını güncelle
  document.getElementById('ammo-count').textContent = player.ammo[player.weapon];
}

// Silah değiştir
window.switchWeapon = (index) => {
  const player = arena.players[arena.playerId];
  if (!player) return;
  
  player.weapon = index;
  db.ref(`arena/players/${arena.playerId}/weapon`).set(index);
  
  document.querySelectorAll('.weapon-option').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });
  
  document.getElementById('current-weapon').textContent = 
    `🔫 ${arena.weapons[index].name}`;
  document.getElementById('ammo-count').textContent = 
    player.ammo[index];
}

// Oyun güncelleme
function updateArena() {
  if (!arena.connected || !arena.players[arena.playerId]) {
    arena.animationFrame = requestAnimationFrame(updateArena);
    return;
  }
  
  const player = arena.players[arena.playerId];
  
  // Hareket
  if (arena.keys.left) {
    player.vx = -5;
    player.direction = -1;
  } else if (arena.keys.right) {
    player.vx = 5;
    player.direction = 1;
  } else {
    player.vx *= 0.8;
  }
  
  // Zıplama
  if (arena.keys.jump && player.onGround) {
    player.vy = -12;
    player.onGround = false;
  }
  
  // Yerçekimi
  player.vy += 0.7;
  
  // Yeni pozisyon
  player.x += player.vx;
  player.y += player.vy;
  
  // Platform çarpışması
  player.onGround = false;
  arena.platforms.forEach(p => {
    if (player.y + 40 > p.y && player.y + 40 < p.y + p.h + 5 &&
        player.x + 20 > p.x && player.x - 20 < p.x + p.w) {
      player.y = p.y - 40;
      player.vy = 0;
      player.onGround = true;
    }
  });
  
  // Sınırlar
  player.x = Math.max(30, Math.min(970, player.x));
  player.y = Math.min(550, player.y);
  
  // Mermi çarpışmaları
  arena.bullets.forEach(b => {
    if (b.shooter !== arena.playerId) {
      if (Math.abs(b.x - player.x) < 30 && Math.abs(b.y - (player.y - 20)) < 30) {
        player.health -= b.damage;
        
        if (player.health <= 0) {
          player.health = 100;
          player.x = 200 + Math.random() * 600;
          player.y = 400;
          
          // Öldüren oyuncuya kill ekle
          db.ref(`arena/players/${b.shooter}/kills`).transaction(k => (k || 0) + 1);
        }
        
        // Mermiyi sil
        db.ref(`arena/bullets/${b.id}`).remove();
      }
    }
  });
  
  // Firebase'e gönder
  db.ref(`arena/players/${arena.playerId}`).update({
    x: player.x,
    y: player.y,
    vx: player.vx,
    vy: player.vy,
    health: player.health,
    ammo: player.ammo,
    onGround: player.onGround,
    direction: player.direction
  });
  
  // HUD'u güncelle
  document.getElementById('your-name').textContent = player.name;
  document.getElementById('your-health-bar').style.width = player.health + '%';
  document.getElementById('kill-counter').innerHTML = `💀 ${player.kills} 💀`;
  document.getElementById('ammo-count').textContent = player.ammo[player.weapon];
  
  // Çiz
  drawArena();
  
  arena.animationFrame = requestAnimationFrame(updateArena);
}

// Oyun çizimi
function drawArena() {
  const ctx = arena.ctx;
  const canvas = arena.canvas;
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Arkaplan
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, '#2a4a6a');
  gradient.addColorStop(0.5, '#1a3a5a');
  gradient.addColorStop(1, '#0a1a2a');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Platformlar
  arena.platforms.forEach((p, i) => {
    ctx.fillStyle = i % 2 === 0 ? '#4CAF50' : '#FFC107';
    ctx.shadowBlur = 20;
    ctx.shadowColor = i % 2 === 0 ? '#4CAF50' : '#FFC107';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.shadowBlur = 0;
  });
  
  // Mermiler
  arena.bullets.forEach(b => {
    const weapon = arena.weapons[b.weapon];
    ctx.fillStyle = weapon.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = weapon.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Oyuncular
  Object.values(arena.players).forEach(p => {
    const isMe = p.id === arena.playerId;
    ctx.shadowBlur = 25;
    ctx.shadowColor = isMe ? '#ffaa2a' : '#ff5a5a';
    
    // Vücut
    ctx.fillStyle = isMe ? '#4a9eff' : '#ff5a5a';
    ctx.beginPath();
    ctx.arc(p.x, p.y - 20, 22, 0, Math.PI * 2);
    ctx.fill();
    
    // Gözler
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(p.x - 7, p.y - 30, 4, 0, Math.PI * 2);
    ctx.arc(p.x + 7, p.y - 30, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#0a0c12';
    ctx.beginPath();
    ctx.arc(p.x - 7, p.y - 30, 2, 0, Math.PI * 2);
    ctx.arc(p.x + 7, p.y - 30, 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Silah
    ctx.fillStyle = '#ffaa2a';
    ctx.fillRect(
      p.x + (p.direction * 20),
      p.y - 25,
      25, 6
    );
    
    // İsim
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'white';
    ctx.font = 'bold 14px Inter';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - 50);
    
    // Can barı
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(p.x - 25, p.y - 60, 50, 8);
    ctx.fillStyle = '#4aff4a';
    ctx.fillRect(p.x - 25, p.y - 60, p.health / 2, 8);
  });
  
  ctx.shadowBlur = 0;
}

// ===== MENÜ FONKSİYONLARI =====

  document.getElementById('sidebar').classList.toggle('open');

function showError(msg) {

}

function showNotification(msg) {
  const notif = document.createElement('div');

  notif.textContent = msg;

  setTimeout(() => notif.remove(), 3000);

// Altun.ai
window.sendToAltun = async () => {
  // Altun.ai kodu buraya...
}

// Sayfa kapanırken
window.addEventListener('beforeunload', () => {
  if (arena.playerId) {
    db.ref(`arena/players/${arena.playerId}`).remove();
  }
});
</script>
